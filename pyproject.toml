[project]
name = "de-zoomcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Joaquin Palacios", email = "110643026+joaquinxtomas@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.5.0",
    "pandas>=3.0.5",
    "psycopg[binary,pool]>=3.3.5",
    "pyarrow>=25.0.1",
    "sqlalchemy>=2.0.52",
    "tqdm>=4.70.0",
]

[project.scripts]
de-zoomcamp = "de_zoomcamp:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pgcli>=4.6.0",
]
